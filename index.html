.btn-go:hover{background:#1740b0;transform:translateY(-1px);box-shadow:0 6px 20px rgba(27,79,216,.3)}

.pb-lbl{font-size:12px;color:var(--muted);white-space:nowrap}
.pb-lbl b{color:var(--accent)}
.qbody{max-width:760px;margin:0 auto;padding:0 16px 80px}
.sec{margin:40px 0 16px;padding:12px 18px;background:var(--ink);color:#fff;border-radius:10px;display:flex;align-items:center;justify-content:space-between}
.sec h2{font-size:13px;font-weight:700}
.sec span{font-size:11px;opacity:.55}
.qc{background:var(--surface);border:1.5px solid var(--border);border-radius:14px;padding:22px 24px;margin-bottom:12px;position:relative;transition:border-color .2s}

.sn2{font-size:76px;font-weight:900;color:var(--accent);line-height:1}
.sd{font-size:15px;color:var(--muted);margin-top:4px}
.lv{display:inline-block;background:var(--ink);color:#fff;font-size:13px;font-weight:700;padding:8px 22px;border-radius:100px;margin-top:16px}
.rn{font-size:12px;color:var(--muted);line-height:1.7}

</style>

</head>

let name="",ans=new Array(Q.length).fill(null);

function level(s,t){
  const r=s/t;
  if(r>=0.9) return "최상위 (S)";
  if(r>=0.75) return "상위 (A)";
  if(r>=0.55) return "중상 (B)";
  if(r>=0.35) return "중하 (C)";
  return "기초 (D)";
}

function start(){
  name=document.getElementById("sn").value.trim();
  if(!name){alert("이름을 입력해 주세요.");return;}
  document.getElementById("cover").style.display="none";
  document.getElementById("quiz").style.display="block";
  render();
}

function render(){
  let h="",sec=null;
  Q.forEach((q,i)=>{
    if(q.sec&&q.sec!==sec){sec=q.sec;h+=`<div class="sec"><h2>${q.sec}</h2><span>Q${i+1}~</span></div>`;}
    const p=q.p?`<div class="passage">${q.p.replace(/\n/g,"<br>")}</div>`:"";
    h+=`<div class="qc" id="c${i}"><span class="pts">${q.pts}점</span>
    <div class="qtop"><div class="qnum">${i+1}</div><div><div class="qtype">${q.t||""}</div><div class="qtext">${q.q.replace(/\n/g,"<br>")}</div></div></div>
    ${p}<div class="opts">`;
    q.o.forEach((o,j)=>{h+=`<label class="ol" id="o${i}_${j}" onclick="pick(${i},${j})"><input type="radio" name="q${i}"><span class="oc">${j+1}</span><span class="ot">${o}</span></label>`;}); 
    h+=`</div></div>`;
  });
  document.getElementById("qb").innerHTML=h;
}

function pick(qi,oi){
  ans[qi]=oi;
  for(let j=0;j<5;j++){const e=document.getElementById(`o${qi}_${j}`);if(e)e.classList.toggle("sel",j===oi);}
  document.getElementById(`c${qi}`).classList.add("done");
  upd();
}

function upd(){
  const d=ans.filter(a=>a!==null).length;
  document.getElementById("dc").textContent=d;
  document.getElementById("pf").style.width=`${d/Q.length*100}%`;
  document.getElementById("si").innerHTML=`<b>${d}/30문항</b> 완료`;
}

function submit(){
  const d=ans.filter(a=>a!==null).length,left=Q.length-d;
  if(left>0&&!confirm(`아직 ${left}문항을 풀지 않았습니다. 그래도 제출하시겠습니까?`))return;
  let sc=0;
  Q.forEach((q,i)=>{if(ans[i]===q.a)sc++;});
  document.getElementById("quiz").style.display="none";
  document.getElementById("result").style.display="flex";
  document.getElementById("rs").textContent=sc;
  document.getElementById("rl").textContent=level(sc,Q.length);
}
